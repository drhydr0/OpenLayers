name: Dev release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dev-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LAYERS_COMMIT: ${{ github.sha }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      LAYERS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      LAYERS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      LAYERS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: versionCode is the commit count.
          fetch-depth: 0

      # Never publish an APK signed with anything but the stable key.
      - name: Decode signing key
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$LAYERS_KEYSTORE_PASSWORD" ] || [ -z "$LAYERS_KEY_ALIAS" ] || [ -z "$LAYERS_KEY_PASSWORD" ]; then
            echo "::error::Signing secrets are missing. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/layers.jks"
          echo "LAYERS_KEYSTORE_PATH=$RUNNER_TEMP/layers.jks" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      # Debug build: it shows the commit hash and is what the developer tests on the phone.
      - name: Unit tests, lint, debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --console=plain

      - name: Check 64-bit-only device support
        run: scripts/check-apk-abis.sh app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk layers-dev.apk
          short=$(git rev-parse --short=12 HEAD)
          count=$(git rev-list --count HEAD)
          notes="Commit ${short}, versionCode ${count}, built $(date -u +%Y-%m-%dT%H:%MZ). Install layers-dev.apk over the previous build."
          git tag -f dev
          git push -f origin refs/tags/dev
          if gh release view dev > /dev/null 2>&1; then
            gh release edit dev --prerelease --title "Dev build" --notes "$notes"
          else
            gh release create dev --prerelease --title "Dev build" --notes "$notes" --verify-tag
          fi
          gh release upload dev layers-dev.apk --clobber

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
