name: PR check

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # A PR checkout's HEAD is a temporary merge commit; show the branch head instead.
      LAYERS_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Caches the Gradle distribution, dependencies, and build cache between runs.
      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests, lint, debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: layers-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
