# Every version is pinned. Never use dynamic versions ("+", "latest.release").
[versions]
agp = "8.13.2"
kotlin = "2.2.21"
jvmToolchain = "21"
compileSdk = "36"
targetSdk = "36"
minSdk = "30"
buildTools = "36.0.0"
junit = "4.13.2"
# 1.9.x is the line built for Kotlin 2.2; newer lines need a newer Kotlin.
kotlinxSerialization = "1.9.0"
recyclerview = "1.4.0"
# Only for on-device tests; not part of the app.
androidxTestRunner = "1.6.2"
androidxTestJunit = "1.2.1"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
